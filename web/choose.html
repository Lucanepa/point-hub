<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e2001a">
<title>Point Hub</title>
<link rel="icon" href="favicon.svg">
<!-- The board's start screen (provisioning/point-hub/pointhub-screen): what to open on the touchscreen. -->
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(#fafaf9,#f5f5f4);color:#1c1917;
    display:flex;flex-direction:column;padding:28px;gap:20px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;text-align:center;padding-top:8px}
  main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  main.one{grid-template-columns:1fr}
  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  .app{background:#fff;border:1px solid rgba(231,229,228,.7);border-radius:24px;box-shadow:0 2px 4px -2px rgb(28 25 23/.08),0 16px 40px -12px rgb(28 25 23/.16);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;transition:background-color .15s}
  .app:active:not(:disabled){background:#f5f5f4}
  .app:disabled{opacity:.45;cursor:default}
  .app img{width:96px;height:96px}
  .app b{font-size:34px;font-weight:700;letter-spacing:-.02em}
  .app span{font-size:22px;color:#57534e;line-height:1.4;max-width:420px}
  footer{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px}
  #msg{font-size:16px;color:#57534e}
  #off{height:52px;padding:0 20px;border-radius:12px;border:1px solid #d6d3d1;background:#fff;font-size:16px;font-weight:600;color:#44403c}
  #off:active{background:#f5f5f4}
  #adm{height:52px;padding:0 20px;border-radius:12px;border:1px solid #d6d3d1;background:#fff;font-size:16px;font-weight:600;color:#44403c;margin-left:auto;margin-right:12px}
  #adm:active{background:#f5f5f4}
  #pad{position:fixed;inset:0;background:rgba(28,25,23,.55);display:flex;align-items:center;justify-content:center}
  #pad[hidden]{display:none}
  #pad .box{background:#fff;border-radius:24px;padding:24px;width:340px;display:flex;flex-direction:column;gap:14px;align-items:center}
  #dots{font-size:34px;letter-spacing:.3em;height:44px;font-weight:700}
  #perr{font-size:16px;color:#b91c1c;min-height:22px;text-align:center}
  #keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
  #keys button,#pad .box>button{height:64px;border-radius:14px;border:1px solid #d6d3d1;background:#fff;font-size:26px;font-weight:600}
  #keys button:active,#pad .box>button:active{background:#f5f5f4}
  #pad .box>button{width:100%;height:52px;font-size:16px}
</style>
</head>
<body>
  <main id="apps">
    <button class="app" data-app="console" type="button">
      <img src="favicon.svg" alt="">
      <b>Point Hub</b>
      <span>Scoring board</span>
    </button>
    <button class="app" data-app="openvolley" type="button">
      <img src="openvolley_mark.svg" alt="">
      <b>OpenVolley eScoresheet</b>
      <span>eScoresheet</span>
    </button>
  </main>
  <footer><span id="msg" role="status"></span><button id="adm" type="button">Admin</button><button id="off" type="button">Shut down</button></footer>
<script>
  const msg = document.getElementById('msg')
  const buttons = [...document.querySelectorAll('.app')]
  const post = (path, body) => fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  if (new URLSearchParams(location.search).get('ov') === '0') {
    buttons[1].hidden = true
    document.getElementById('apps').classList.add('one')
  }
  for (const b of buttons) {
    b.addEventListener('click', async () => {
      buttons.forEach((x) => { x.disabled = true })
      msg.textContent = 'Opening…'
      let ok = false
      try { ok = (await post('/api/screen', { app: b.dataset.app })).ok } catch { /* below */ }
      if (!ok) {
        msg.textContent = 'That did not work. Tap again.'
        buttons.forEach((x) => { x.disabled = false })
      }
    })
  }
  const off = document.getElementById('off')
  let armed = null
  off.addEventListener('click', async () => {
    if (!armed) {
      off.textContent = 'Tap again to shut down'
      armed = setTimeout(() => { armed = null; off.textContent = 'Shut down' }, 4000)
      return
    }
    clearTimeout(armed)
    off.disabled = true
    msg.textContent = 'Shutting down. Unplug when the STATUS light is off.'
    try { await post('/api/shutdown', {}) } catch { /* the board is going away */ }
  })
  const pad = document.getElementById('pad'), dots = document.getElementById('dots'), perr = document.getElementById('perr'), keys = document.getElementById('keys')
  let pin = ''
  const draw = () => { dots.textContent = '•'.repeat(pin.length) }
  for (const k of ['1','2','3','4','5','6','7','8','9','⌫','0','OK']) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = k
    b.addEventListener('click', async () => {
      if (k === '⌫') pin = pin.slice(0, -1)
      else if (k === 'OK') {
        if (pin.length < 4) return
        perr.textContent = ''
        let r = null
        try { r = await post('/api/admin', { pin }) } catch { /* below */ }
        if (r && r.ok) { perr.textContent = 'Opening…'; return }
        const j = r ? await r.json().catch(() => ({})) : {}
        perr.textContent = r && r.status === 429 ? `Too many tries. Wait ${Math.ceil((j.retryAfterMs || 30000) / 1000)} s.` : r && r.status === 501 ? 'Admin is not set up.' : 'Wrong PIN'
        pin = ''
      } else if (pin.length < 12) pin += k
      draw()
    })
    keys.appendChild(b)
  }
  document.getElementById('adm').addEventListener('click', () => { pin = ''; draw(); perr.textContent = ''; pad.hidden = false })
  document.getElementById('pcancel').addEventListener('click', () => { pad.hidden = true; pin = ''; draw() })
</script>
  <div id="pad" hidden role="dialog" aria-label="Admin PIN">
    <div class="box">
      <b>Admin PIN</b>
      <div id="dots" aria-live="polite"></div>
      <div id="perr" role="status"></div>
      <div id="keys"></div>
      <button id="pcancel" type="button">Cancel</button>
    </div>
  </div>
</body>
</html>
