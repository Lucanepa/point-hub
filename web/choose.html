<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e2001a">
<title>Point Hub</title>
<link rel="icon" href="favicon.svg">
<!-- The board's start screen (provisioning/point-hub/pointhub-screen): what to open on the touchscreen. -->
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(#fafaf9,#f5f5f4);color:#1c1917;
    display:flex;flex-direction:column;padding:28px;gap:20px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;text-align:center;padding-top:8px}
  main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  main.one{grid-template-columns:1fr}
  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  .app{background:#fff;border:1px solid rgba(231,229,228,.7);border-radius:24px;box-shadow:0 2px 4px -2px rgb(28 25 23/.08),0 16px 40px -12px rgb(28 25 23/.16);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;transition:background-color .15s}
  .app:active:not(:disabled){background:#f5f5f4}
  .app:disabled{opacity:.45;cursor:default}
  .app img{width:96px;height:96px}
  .app b{font-size:34px;font-weight:700;letter-spacing:-.02em}
  .app span{font-size:17px;color:#57534e;line-height:1.4;max-width:420px}
  footer{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px}
  #msg{font-size:16px;color:#57534e}
  #off{height:52px;padding:0 20px;border-radius:12px;border:1px solid #d6d3d1;background:#fff;font-size:16px;font-weight:600;color:#44403c}
  #off:active{background:#f5f5f4}
</style>
</head>
<body>
  <h1>What do you want to open?</h1>
  <main id="apps">
    <button class="app" data-app="console" type="button">
      <img src="favicon.svg" alt="">
      <b>Point Hub</b>
      <span>Score on the board: points, sets, time-outs and subs, tonight's game, board settings.</span>
    </button>
    <button class="app" data-app="openvolley" type="button">
      <img src="openvolley_mark.svg" alt="">
      <b>OpenVolley eScoresheet</b>
      <span>The full scoresheet: rosters, lineups, court, signatures. The board follows the match by itself.</span>
    </button>
  </main>
  <footer><span id="msg" role="status"></span><button id="off" type="button">Shut down</button></footer>
<script>
  const msg = document.getElementById('msg')
  const buttons = [...document.querySelectorAll('.app')]
  const post = (path, body) => fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  if (new URLSearchParams(location.search).get('ov') === '0') {
    buttons[1].hidden = true
    document.getElementById('apps').classList.add('one')
  }
  for (const b of buttons) {
    b.addEventListener('click', async () => {
      buttons.forEach((x) => { x.disabled = true })
      msg.textContent = 'Opening…'
      let ok = false
      try { ok = (await post('/api/screen', { app: b.dataset.app })).ok } catch { /* below */ }
      if (!ok) {
        msg.textContent = 'That did not work. Tap again.'
        buttons.forEach((x) => { x.disabled = false })
      }
    })
  }
  const off = document.getElementById('off')
  let armed = null
  off.addEventListener('click', async () => {
    if (!armed) {
      off.textContent = 'Tap again to shut down'
      armed = setTimeout(() => { armed = null; off.textContent = 'Shut down' }, 4000)
      return
    }
    clearTimeout(armed)
    off.disabled = true
    msg.textContent = 'Shutting down. Unplug when the STATUS light is off.'
    try { await post('/api/shutdown', {}) } catch { /* the board is going away */ }
  })
</script>
</body>
</html>
