# Point Hub board: as squeekboard 1.43.1's number/us_wide.yaml, with a ▼ key (F20: the app closes the keyboard)
---
outlines:
    default:   { width: 73.5, height: 42 }
    spaceline: { width: 147,  height: 42 }
    special:   { width: 73.5, height: 42 }

views:
    base:
        - "( 1 2 3 )"
        - "# 4 5 6 +"
        - "* 7 8 9 -"
        - "BackSpace 0 hide Return"

buttons:
    hide:
        outline: "spaceline"
        label: "▼"
        keysym: "F20"
    BackSpace:
        outline: "special"
        icon: "edit-clear-symbolic"
        action: "erase"
    space:
        outline: "spaceline"
        text: " "
        label: "␣"
    Return:
        outline: "special"
        icon: "key-enter"
        keysym: "Return"
