# openscore and startled on the Point Hub board (Pi 5, Triple Bonnet, 8 modules). Copied to
# setting.ini by provisioning/point-hub/setup-board.sh; the C0270 keeps its own file.
#
# CRITICAL: like the C0270's, these describe the physical panel, and a wrong value only shows on the
# glass. Settings from first light (docs/diy-panel/BUILD.md section 10.2).

[DISPLAY]
# The canvas: 3 outputs x 3 slots of 64 x 32. Rows 0-63 are the front, 64-95 the bench modules.
width=192
height=96
# Which way each bench picture is turned into its slot, in degrees counter-clockwise: 90 or 270.
# Set with the module-number test on the glass (BUILD.md section 10.5).
bench_left_rotate=90
bench_right_rotate=270
hardware_mapping=regular
multiplexing=0
# RGB, checked with a plain red and a plain blue picture on the module (5 Nov 2026). The BGR in the
# first-light notes was a misreading: that module was lying upside down, which reverses the bars.
rgb_sequence=RGB
pwm_bits=10
pwm_dither=2
# Piomatter has no equivalent of these two, but startled always passes them, so they must have a value.
slowdown_gpio=0
pwm_lsb_nanoseconds=130
no_hardware_pulsing=0
brightness=40
# The power governor takes its budget from pointhubd through /run/ledbox-panel/power. This is only
# what it starts from before that file exists: what the weakest charger allows.
power_budget_ma=1300
power_full_white_ma=19800
power_idle_ma=800

[TCP]
port=8889

[HORN]
# Each beep is one call; pointhubd switches it off by itself after 600 ms.
cmd=/opt/pointhub/pointhubd.py ctl horn 600
