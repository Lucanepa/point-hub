:root{--red:#e2001a;--red7:#be0014;--slate:#0f172a;
 --p1:#fafaf9;--p2:#f5f5f4;--card:#fff;--sunk:#fafaf9;--ctl:#f5f5f4;--ink:#1c1917;--ink2:#44403c;--mut:#78716c;--faint:#a8a29e;
 --line:rgba(231,229,228,.7);--line2:#e7e5e4;--line3:#d6d3d1;--sel:#0f172a;--selt:#fff;
 --shadow:0 1px 2px -1px rgb(28 25 23/.06),0 6px 20px -8px rgb(28 25 23/.12);
 --okb:#ecfdf5;--okt:#047857;--wab:#fffbeb;--wat:#b45309;--wal:#fde68a;--bab:#fef2f2;--bat:#be0014;--bal:#fecaca;--inb:#f0f9ff;--int:#0369a1;--inl:#bae6fd}
[data-theme=dark]{--p1:#1c1917;--p2:#171412;--card:#292524;--sunk:#231f1e;--ctl:#37322f;--ink:#fafaf9;--ink2:#e7e5e4;--mut:#a8a29e;--faint:#78716c;
 --line:#44403c;--line2:#44403c;--line3:#57534e;--sel:#fafaf9;--selt:#0f172a;--shadow:none;
 --okb:#052e22;--okt:#6ee7b7;--wab:#3b2a06;--wat:#fcd34d;--wal:#78500f;--bab:#3f0d10;--bat:#fca5a5;--bal:#7f1d1d;--inb:#082f49;--int:#7dd3fc;--inl:#0c4a6e}
[data-theme=eink]{--p1:#fff;--p2:#fff;--card:#fff;--sunk:#fff;--ctl:#fff;--ink:#000;--ink2:#000;--mut:#000;--faint:#000;--line:#000;--line2:#000;--line3:#000;--sel:#000;--selt:#fff;--shadow:none;
 --okb:#fff;--okt:#000;--wab:#fff;--wat:#000;--wal:#000;--bab:#fff;--bat:#000;--bal:#000;--inb:#fff;--int:#000;--inl:#000}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#292524;overflow:hidden;overscroll-behavior:none}
body{font-family:Inter,system-ui,sans-serif;font-variation-settings:"opsz" 32;font-optical-sizing:none;font-feature-settings:"cv02","cv03","cv04","cv11";color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;background:linear-gradient(var(--p1),var(--p2));display:flex;flex-direction:column;font-size:15px}

/* top */
.top{height:64px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line2)}
.setl{width:176px;height:48px;text-align:left;display:flex;flex-direction:column;justify-content:center;border-radius:12px;padding:0 10px;margin-left:-4px}
.setl:active{background:var(--ctl)}
.setl b{font-size:19px;line-height:1.15;letter-spacing:-.01em}
.setl span{font-size:12px;color:var(--mut);white-space:nowrap}
.nav{display:flex;gap:2px;background:var(--ctl);padding:3px;border-radius:13px}
.nav button{width:82px;height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2)}
.nav button .ic{width:19px;height:19px}
.nav button.on{background:var(--sel);color:var(--selt)}
.hl{margin-left:auto;display:flex;height:50px;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--card)}
.hc{width:76px;display:flex;flex-direction:column;justify-content:center;padding:0 8px;border-left:1px solid var(--line2);line-height:1.2}
.hc:first-child{border-left:0}
.hc i{font-style:normal;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.hc b{font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:4px}
.hc b:before{content:"";width:7px;height:7px;border-radius:9px;background:#10b981;flex:none}
.hc.wa{background:var(--wab)}.hc.wa b{color:var(--wat)}.hc.wa b:before{background:#f59e0b}
.hc.ba{background:var(--bab)}.hc.ba b{color:var(--bat)}.hc.ba b:before{background:var(--red)}
.hc.no b:before{background:var(--faint)}
.clk{font-size:21px;font-weight:600;width:62px;text-align:right}

/* banners */
.ban{flex:none;min-height:52px;border-radius:12px;display:flex;align-items:center;gap:12px;padding:6px 8px 6px 14px;border:1px solid;font-size:15px}
.ban b{font-weight:600}.ban .ic{width:21px;height:21px}
.ban span{flex:1;min-width:0}
.ban.re{background:var(--bab);border-color:var(--bal);color:var(--bat)}
.ban.am{background:var(--wab);border-color:var(--wal);color:var(--wat)}
.ban.sk{background:var(--inb);border-color:var(--inl);color:var(--int)}
.ban.ne{background:var(--card);border-color:var(--line2);box-shadow:var(--shadow)}

/* buttons */
.b{height:48px;padding:0 16px;border-radius:10px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line3);background:var(--card);color:var(--ink2);white-space:nowrap;transition:background-color .15s,color .15s,transform .05s}
.b:active:not(:disabled){background:var(--ctl);transform:scale(.985)}
.b:disabled{opacity:.42}
.b.pr{background:var(--red);border-color:var(--red);color:#fff}.b.pr:active:not(:disabled){background:var(--red7)}
.b.dk{background:var(--sel);border-color:var(--sel);color:var(--selt)}.b.dk:active:not(:disabled){background:var(--sel);opacity:.86}
.b.ok{background:#059669;border-color:#059669;color:#fff}.b.ok:active:not(:disabled){background:#047857}
.b.da{border-color:var(--bal);color:var(--bat)}
.b.lg{height:64px;font-size:18px;padding:0 24px;border-radius:12px}
.b.xl{height:76px;font-size:22px;padding:0 32px;border-radius:14px}
.b.sm{height:44px;font-size:14px;padding:0 12px}
.b.w{width:100%}

/* game */
.gm{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;padding:9px 12px 10px;position:relative}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 272px minmax(0,1fr);gap:12px}
.tc{display:flex;flex-direction:column;gap:8px;min-height:0}
.tp{flex:1;min-height:0;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative}
[data-theme=eink] .tp{border:3px solid #000;background:#fff!important;color:#000!important}
.tb{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;width:100%;color:inherit;text-align:left}
.tb b{font-size:26px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tb .ed{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgb(0 0 0/.12);flex:none}

function checks(t){const m=S.m,sp=S.sport;
 if(sp==='volleyball'||sp==='beach'){const dec=decider(m),target=dec?15:(sp==='beach'?21:25),a=m.pts[0],b=m.pts[1];
  if((a>=target||b>=target)&&Math.abs(a-b)>=2){const w=a>b?0:1;m.sets[w]++;m.results.push({a,b,dur:m.setStart?Math.max(1,Math.round((Date.now()-m.setStart)/60000)):21});
   if(m.sets[w]>=toWin()){m.over=true;S.ov={k:'matchAsk',w}}else S.ov={k:'setEnd',w};return}
  if(sp==='volleyball'&&dec&&!m.sw8&&Math.max(a,b)===8){m.sw8=true;S.ov={k:'switch',why:'Decider: '+nm(a>b?0:1)+' reached 8.'}}
  if(sp==='beach'){const every=dec?5:7,sum=a+b;if(sum>0&&sum%every===0)S.ov={k:'switch',why:`Every ${every} points in this set (${a}–${b}).`};
   if(!dec&&sum===21&&!m.tto&&C().ttoSeconds>0){m.tto=true;S.ov=null;startCd({kind:'tto',label:'Technical time-out',secs:C().ttoSeconds})}}}
