<!doctype html>
<!-- Adaptive-icon FOREGROUND layer for Point Hub, from web/favicon.svg without its background
     rect (the background layer is @color/ic_launcher_background = #111827). The viewBox is
     widened so the ring's outer edge (r 10 + half the 2.6 stroke = 11.3 units) lands at ~30 of
     the 108-unit canvas: inside the 66/108 safe zone (r 33) that every launcher mask keeps. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden}
svg{display:block;width:100vw;height:100vh}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.375 -4.375 40.75 40.75">
  <circle cx="16" cy="16" r="10" fill="none" stroke="#FFC832" stroke-width="2.6" opacity=".62"
          stroke-dasharray="14 6.6" stroke-dashoffset="3" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="5.2" fill="#FFC832"/>
</svg>
</body></html>
